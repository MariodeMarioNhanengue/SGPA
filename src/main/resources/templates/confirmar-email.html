<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmação de email – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-900: #0a1f14; --green-700: #1a3d28; --green-500: #2d6a4f;
      --cream: #f5f0e8; --warm-white:#fdfcf9;
      --text-dark: #0e1e16; --text-mid: #3d5a47;
      --error: #c0392b;
      --ff-display: 'Cormorant Garamond', Georgia, serif;
      --ff-body: 'Outfit', system-ui, sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--ff-body);
      background: radial-gradient(ellipse 120% 80% at -10% 110%, rgba(82,183,136,.25) 0%, transparent 55%),
                  radial-gradient(ellipse 80% 60% at 110% -10%, rgba(201,168,76,.12) 0%, transparent 50%),
                  linear-gradient(160deg, var(--green-900) 0%, var(--green-700) 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--warm-white);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px; width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,.35);
    }
    .icon { font-size: 3.2rem; margin-bottom: 18px; }
    .icon.ok { color: var(--green-500); }
    .icon.erro { color: var(--error); }
    h1 { font-family: var(--ff-display); font-weight: 600; font-size: 1.9rem; color: var(--text-dark); margin-bottom: 12px; }
    p { color: var(--text-mid); font-size: .95rem; line-height: 1.6; margin-bottom: 28px; }
    a.btn {
      display: inline-flex; align-items:center; gap:8px;
      padding: 12px 26px; border-radius: 10px;
      background: linear-gradient(135deg, var(--green-500), var(--green-700));
      color:#fff; text-decoration:none; font-weight: 600; font-size: .92rem;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <div th:if="${sucesso}">
      <div class="icon ok"><i class="bi bi-check-circle-fill"></i></div>
      <h1>Email confirmado!</h1>
      <p>A sua conta foi activada com sucesso. Já pode entrar na plataforma com o seu email e senha.</p>
      <a href="/login" class="btn"><i class="bi bi-box-arrow-in-right"></i> Ir para o login</a>
    </div>
    <div th:unless="${sucesso}">
      <div class="icon erro"><i class="bi bi-x-circle-fill"></i></div>
      <h1>Link inválido</h1>
      <p>Este link de confirmação é inválido, já foi usado, ou expirou (é válido por 24 horas). Pode pedir um novo link na página de login.</p>
      <a href="/login" class="btn"><i class="bi bi-arrow-left"></i> Voltar ao login</a>
    </div>
  </div>
</body>
</html>
