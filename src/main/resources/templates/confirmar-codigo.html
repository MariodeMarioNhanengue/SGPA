<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmar e-mail – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-900: #0a1f14; --green-700: #1a3d28; --green-500: #2d6a4f;
      --cream: #f5f0e8; --warm-white:#fdfcf9;
      --text-dark: #0e1e16; --text-mid: #3d5a47;
      --error: #c0392b;
      --ff-display: 'Cormorant Garamond', Georgia, serif;
      --ff-body: 'Outfit', system-ui, sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--ff-body);
      background: radial-gradient(ellipse 120% 80% at -10% 110%, rgba(82,183,136,.25) 0%, transparent 55%),
                  radial-gradient(ellipse 80% 60% at 110% -10%, rgba(201,168,76,.12) 0%, transparent 50%),
                  linear-gradient(160deg, var(--green-900) 0%, var(--green-700) 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--warm-white);
      border-radius: 20px;
      padding: 44px 40px 36px;
      max-width: 440px; width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,.35);
    }
    .icon { font-size: 3.2rem; margin-bottom: 14px; color: var(--green-500); }
    h1 { font-family: var(--ff-display); font-weight: 600; font-size: 1.9rem; color: var(--text-dark); margin-bottom: 12px; }
    p { color: var(--text-mid); font-size: .95rem; line-height: 1.6; margin-bottom: 22px; }
    p strong { color: var(--text-dark); word-break: break-all; }

    .alerta { border-radius: 10px; padding: 11px 14px; font-size: .88rem; line-height: 1.45; margin-bottom: 20px; text-align: left; display: flex; gap: 9px; }
    .alerta.ok   { background: #e7f5ec; color: #1d5a3a; border: 1px solid #bfe3cd; }
    .alerta.erro { background: #fdecea; color: var(--error); border: 1px solid #f5c2bd; }

    .codigo {
      width: 100%;
      font-family: var(--ff-body); font-size: 2rem; font-weight: 600;
      letter-spacing: .5em; text-indent: .5em; text-align: center;
      padding: 12px 8px; margin-bottom: 16px;
      border: 2px solid #cfdcd3; border-radius: 12px; background: #fff; color: var(--text-dark);
    }
    .codigo:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 4px rgba(45,106,79,.15); }
    .codigo::placeholder { color: #c3cfc7; letter-spacing: .5em; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 12px 26px; border-radius: 10px; border: 0; cursor: pointer;
      background: linear-gradient(135deg, var(--green-500), var(--green-700));
      color: #fff; text-decoration: none; font-family: inherit; font-weight: 600; font-size: .95rem;
    }
    .btn:hover { filter: brightness(1.08); }

    .extras { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e6ece8; font-size: .85rem; color: var(--text-mid); }
    .extras form { margin: 0 0 10px; }
    .link {
      background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: inherit;
      color: var(--green-500); font-weight: 600; text-decoration: underline;
    }
    .link:hover { color: var(--green-700); }
    .extras a { color: var(--text-mid); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="bi bi-envelope-check"></i></div>
    <h1>Confirme o seu e-mail</h1>

    <div th:if="${sucesso}" class="alerta ok" role="status">
      <i class="bi bi-check-circle-fill"></i><span th:text="${sucesso}"></span>
    </div>
    <div th:if="${erro}" class="alerta erro" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${erro}"></span>
    </div>

    <p>
      Enviámos um código de 6 dígitos para <strong th:text="${email}">email</strong>.
      Introduza-o abaixo para activar a sua conta de
      <strong th:text="${tipo == 'PRODUTOR' ? 'Produtor' : 'Comprador'}">Comprador</strong>.
      O código é válido por <span th:text="${validadeMinutos}">15</span> minutos.
    </p>

    <form th:action="@{/confirmar-codigo}" method="post" autocomplete="off">
      <input type="text" name="codigo" id="codigo" class="codigo"
             inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
             placeholder="000000" aria-label="Código de 6 dígitos" required autofocus/>
      <button type="submit" class="btn"><i class="bi bi-check-circle"></i> Confirmar</button>
    </form>

    <div class="extras">
      <form th:action="@{/reenviar-confirmacao}" method="post">
        <input type="hidden" name="email" th:value="${email}"/>
        Não recebeu o e-mail? <button type="submit" class="link">Enviar novo código</button>
      </form>
      <a th:href="@{${painelUrl}}">Fazer isto mais tarde</a>
    </div>
  </div>

  <script>
    // Só dígitos, no máximo 6 — também ao colar "123 456" ou "123-456".
    var campo = document.getElementById('codigo');
    campo.addEventListener('input', function () {
      campo.value = campo.value.replace(/\D/g, '').slice(0, 6);
    });
  </script>
</body>
</html>
