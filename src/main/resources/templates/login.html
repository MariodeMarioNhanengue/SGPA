<div class="lp-wrap">

  <!-- CARTÃO DE LOGIN -->
  <main class="lp-card">
    <svg class="lp-card-leaf" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M10 90 C10 40 45 8 92 8 C92 55 60 92 10 90 Z" fill="currentColor"/>
      <path d="M10 90 C35 60 55 40 80 20" stroke="#fff" stroke-width="2" fill="none"/>
    </svg>

    <div class="lp-logo">
      <a href="/" aria-label="Voltar ao início">
        <img src="/images/logo-sgpa.png" alt="Logotipo SGPA – Plataforma Agrária de Moçambique"/>
      </a>
    </div>

    <h1 class="lp-title">Bem-vindo(a)!</h1>
    <p class="lp-sub">Acesse a sua conta para continuar</p>

    <div th:if="${erro}" class="lp-alert" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span th:text="${erro}"></span>
    </div>

    <div th:if="${sucesso}" class="lp-alert-ok" role="status">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${sucesso}"></span>
    </div>

    <div th:if="${emailPorConfirmar}" class="lp-alert-warn">
      <strong><i class="bi bi-envelope-exclamation-fill"></i> Confirme o seu e-mail</strong>
      A sua conta ainda não foi activada. Enviámos um link de confirmação para <span th:text="${emailValue}"></span> quando se registou.
      <form th:action="@{/reenviar-confirmacao}" method="post" class="lp-resend-form">
        <input type="hidden" name="email" th:value="${emailValue}"/>
        <button type="submit" class="lp-resend-btn">Reenviar e-mail de confirmação</button>
      </form>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm" novalidate>

      <div class="lp-field">
        <i class="bi bi-person lp-field-icon"></i>
        <input type="email" id="emailInput" name="email" class="lp-input"
               placeholder="E-mail" aria-label="E-mail"
               th:value="${emailValue}"
               required autocomplete="email" autofocus/>
      </div>

      <div class="lp-field">
        <i class="bi bi-lock lp-field-icon"></i>
        <input type="password" id="senhaInput" name="senha" class="lp-input"
               placeholder="Palavra-passe" aria-label="Palavra-passe"
               required autocomplete="current-password"/>
        <button type="button" class="lp-eye" id="toggleBtn" onclick="toggleSenha()" aria-label="Mostrar palavra-passe">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>

      <div class="lp-forgot-row">
        <a href="/recuperar-senha" class="lp-forgot"><i class="bi bi-key"></i> Esqueceu a palavra-passe?</a>
      </div>

      <button type="submit" class="lp-btn" id="submitBtn">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Entrar</span>
      </button>
    </form>

    <p class="lp-register">
      Não tem uma conta? Registe-se como
      <a href="/produtor/criar">Produtor</a><span class="sep">·</span><a href="/comprador/criar">Comprador</a>
    </p>
  </main>

</div>

<script>
  function toggleSenha() {
    const input = document.getElementById('senhaInput');
    const icon  = document.getElementById('eyeIcon');
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    icon.className = hidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    document.getElementById('toggleBtn').setAttribute('aria-label', hidden ? 'Ocultar palavra-passe' : 'Mostrar palavra-passe');
  }
  document.getElementById('loginForm').addEventListener('submit', function () {
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> <span>A verificar...</span>';
    btn.disabled = true;
  });
</script>
