<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Minhas Ofertas - SGPA</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

    <!-- CSS AGRÍCOLA (RENOMEADO) -->
    <link rel="stylesheet" th:href="@{/css/produtor-green.css}"/>

</head>

<body class="bg-agro">

<div class="container-fluid p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-success fw-bold">
            <i class="bi bi-tree-fill me-2"></i> Minhas Ofertas
        </h3>

        <a th:href="@{/produtor/dashboard}" class="btn btn-outline-success">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
    </div>

    <!-- SEARCH + ACTIONS -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body d-flex flex-wrap gap-2 align-items-center">

            <input type="text" id="searchInput"
                   class="form-control w-25"
                   placeholder="Pesquisar produto...">

            <select id="filterEstado" class="form-select w-25">
                <option value="">Todos</option>
                <option value="ativo">Activo</option>
                <option value="inativo">Inactivo</option>
            </select>

            <button class="btn btn-success ms-auto" data-bs-toggle="modal" data-bs-target="#modalNovaOferta">
                <i class="bi bi-plus-circle"></i> Nova Oferta
            </button>

        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm border-0">
        <div class="card-body table-responsive">

            <table class="table table-hover align-middle" id="tabelaOfertas">

                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="oferta, iStat : ${minhasOfertas}">
                    <td th:text="${iStat.count}"></td>

                    <td class="fw-semibold" th:text="${oferta.nomeProduto}"></td>

                    <td th:text="${oferta.categoria}"></td>

                    <td th:text="${oferta.quantidadeTotal + ' ' + oferta.unidade}"></td>

                    <td class="text-success fw-bold"
                        th:text="'MT ' + ${oferta.preco}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${oferta.estado == 'ativo'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${oferta.estado}">
                        </span>
                    </td>

                    <td>

                        <!-- EDIT -->
                        <button class="btn btn-sm btn-primary btn-editar"
                                th:data-id="${oferta.id}"
                                th:data-preco="${oferta.preco}"
                                th:data-quantidade="${oferta.quantidadeTotal}">
                            <i class="bi bi-pencil"></i>
                        </button>

                        <!-- DELETE -->
                        <button class="btn btn-sm btn-danger btn-eliminar"
                                th:data-id="${oferta.id}">
                            <i class="bi bi-trash"></i>
                        </button>

                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>
</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="text-success">
                    <i class="bi bi-pencil-square"></i> Editar Oferta
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editId"/>

                <label>Preço</label>
                <input type="text" id="editPreco" class="form-control mb-3"/>

                <label>Quantidade</label>
                <input type="text" id="editQuantidade" class="form-control"/>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" id="btnSalvar">Guardar</button>
            </div>

        </div>
    </div>
</div>

<!-- MODAL NOVA OFERTA (simples) -->
<div class="modal fade" id="modalNovaOferta">
    <div class="modal-dialog modal-lg">
        <div class="modal-content p-3">

            <h5 class="text-success mb-3">Nova Oferta</h5>

            <form th:action="@{/produtor/publicar-oferta}" method="post">

                <input type="text" name="nomeProduto" class="form-control mb-2" placeholder="Produto"/>
                <input type="text" name="categoria" class="form-control mb-2" placeholder="Categoria"/>

                <input type="text" name="quantidadeTotal" class="form-control mb-2 quantidade"/>
                <input type="text" name="preco" class="form-control mb-2 preco"/>

                <button class="btn btn-success w-100">
                    Publicar
                </button>

            </form>

        </div>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function(){

    // MASK
    $('.preco').mask('0000000');
    $('.quantidade').mask('0000000');

    // PESQUISA
    $("#searchInput").on("keyup", function () {
        let value = $(this).val().toLowerCase();
        $("#tabelaOfertas tbody tr").filter(function () {
            $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
    });

    // EDITAR
    $(".btn-editar").on("click", function () {
        $("#editId").val($(this).data("id"));
        $("#editPreco").val($(this).data("preco"));
        $("#editQuantidade").val($(this).data("quantidade"));

        $("#modalEditar").modal("show");
    });

    // GUARDAR (AJAX simples)
    $("#btnSalvar").on("click", function () {

        let id = $("#editId").val();

        $.ajax({
            url: "/produtor/oferta/editar/" + id,
            type: "POST",
            data: {
                preco: $("#editPreco").val(),
                quantidade: $("#editQuantidade").val()
            },
            success: function () {
                location.reload();
            }
        });

    });

    // ELIMINAR
    $(".btn-eliminar").on("click", function () {

        let id = $(this).data("id");

        if(confirm("Eliminar esta oferta?")) {
            $.post("/produtor/oferta/eliminar/" + id, function () {
                location.reload();
            });
        }

    });

});
</script>

</body>
</html>
