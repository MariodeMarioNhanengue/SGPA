<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Perfil – Produtor – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    .avatar-upload-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 0.5rem;
    }
    .avatar-upload-wrap img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #16a34a;
    }
    .avatar-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg,#d1fae5,#a7f3d0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: #16a34a;
      border: 3px solid #16a34a;
    }
    .avatar-upload-btn {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #16a34a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      border: 2px solid white;
      transition: background .2s;
    }
    .avatar-upload-btn:hover { background: #15803d; }
  </style>
</head>
<body class="dashboard-body">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <img src="/images/logo.png" alt="Logo SGPA" class="logo-sm">
      <span class="brand-text">SGPA</span>
    </a>
  </div>
  <div class="sidebar-user px-3 py-3 border-bottom border-white border-opacity-10">
    <div class="d-flex align-items-center gap-2">
      <div class="avatar-circle" style="overflow:hidden;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#d1fae5,#a7f3d0);display:flex;align-items:center;justify-content:center;">
        <img th:if="${produtor != null and produtor.fotoPerfil != null and !#strings.isEmpty(produtor.fotoPerfil)}"
             th:src="${produtor.fotoPerfil}" alt="Foto"
             style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>
        <i th:if="${produtor == null or produtor.fotoPerfil == null or #strings.isEmpty(produtor.fotoPerfil)}"
           class="bi bi-person-fill" style="color:#16a34a;"></i>
      </div>
      <div>
        <div class="text-white fw-semibold small" th:text="${produtor != null ? produtor.nomeCompleto : 'Produtor'}"></div>
        <div class="text-white opacity-50 small">Produtor</div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav mt-2">
    <a th:href="@{/produtor/dashboard}" class="sidebar-link">
      <i class="bi bi-grid-fill"></i> Visão Geral
    </a>
    <a th:href="@{/produtor/publicar-oferta}" class="sidebar-link">
      <i class="bi bi-plus-circle-fill"></i> Publicar Oferta
    </a>
    <a th:href="@{/produtor/minhas-ofertas}" class="sidebar-link">
      <i class="bi bi-box-seam-fill"></i> Minhas Ofertas
    </a>
    <a th:href="@{/produtor/pedidos}" class="sidebar-link">
      <i class="bi bi-list-check"></i> Pedidos Recebidos
    </a>
    <a th:href="@{/produtor/historico}" class="sidebar-link">
      <i class="bi bi-clock-history"></i> Histórico de Vendas
    </a>
    <a class="sidebar-link active">
      <i class="bi bi-pencil-square"></i> Editar Perfil
    </a>
  </nav>
  <div class="sidebar-footer">
    <a th:href="@{/logout}" class="sidebar-link text-danger-light">
      <i class="bi bi-box-arrow-left"></i> Sair
    </a>
  </div>
</div>

<!-- MAIN -->
<div class="main-content">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="topbar d-flex align-items-center justify-content-between px-4 py-2">
    <div class="d-flex align-items-center gap-3">
      <button class="mobile-toggle" onclick="toggleSidebar()" title="Menu"><i class="bi bi-list"></i></button>
      <h6 class="mb-0 fw-semibold text-dark">
        <i class="bi bi-pencil-square me-2 text-accent"></i>Editar Perfil
      </h6>
    </div>
    <span class="badge" style="background:var(--green-pale);color:var(--accent);">Produtor</span>
  </div>

  <div class="content-area p-4">

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show">
      <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show">
      <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="page-card" style="max-width:700px;">
      <div class="page-card-header">
        <h5><i class="bi bi-person-fill me-2" style="color:#16a34a;"></i>Dados do Produtor</h5>
      </div>
      <div class="p-4">
        <form th:action="@{/produtor/editar-perfil}" method="post" enctype="multipart/form-data">
          <input type="hidden" name="id" th:value="${produtor.id}"/>

          <!-- FOTO DE PERFIL -->
          <div class="text-center mb-4">
            <div class="avatar-upload-wrap" id="avatarWrap">
              <img th:if="${produtor.fotoPerfil != null and !#strings.isEmpty(produtor.fotoPerfil)}"
                   th:src="${produtor.fotoPerfil}"
                   id="avatarPreview" alt="Foto de Perfil"/>
              <div th:if="${produtor.fotoPerfil == null or #strings.isEmpty(produtor.fotoPerfil)}"
                   class="avatar-placeholder" id="avatarPlaceholder">
                <i class="bi bi-person-fill"></i>
              </div>
              <label for="fotoPerfilFile" class="avatar-upload-btn" title="Alterar foto">
                <i class="bi bi-camera-fill"></i>
              </label>
            </div>
            <input type="file" id="fotoPerfilFile" name="fotoPerfilFile"
                   accept="image/*" class="d-none" onchange="previewFoto(this)"/>
            <div class="text-muted small mt-1">Clique na câmara para alterar a foto de perfil</div>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nome *</label>
              <input type="text" class="form-control" name="nome"
                     th:value="${produtor.nome}" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Apelido *</label>
              <input type="text" class="form-control" name="apelido"
                     th:value="${produtor.apelido}" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Telefone</label>
              <input type="tel" class="form-control" name="telefone"
                     th:value="${produtor.telefone}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">NUIT</label>
              <input type="text" class="form-control" name="nuit"
                     th:value="${produtor.nuit}"/>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" name="email"
                     th:value="${produtor.email}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nova Senha <span class="text-muted fw-normal small">(deixe em branco para manter)</span></label>
              <input type="password" class="form-control" name="senha"
                     placeholder="Nova senha..."/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirmar Nova Senha</label>
              <input type="password" class="form-control" id="senhaConfirm"
                     placeholder="Confirme a nova senha..."/>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <a th:href="@{/produtor/dashboard}"
               class="btn btn-outline-secondary px-4">
              <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
            <button type="submit" class="btn btn-accent px-5">
              <i class="bi bi-check-circle-fill me-2"></i>Guardar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
  const s1 = document.querySelector('input[name="senha"]').value;
  const s2 = document.getElementById('senhaConfirm').value;
  if (s1 && s1 !== s2) {
    e.preventDefault();
    alert('As senhas não coincidem!');
  }
});

function previewFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const placeholder = document.getElementById('avatarPlaceholder');
      if (placeholder) placeholder.remove();
      let img = document.getElementById('avatarPreview');
      if (!img) {
        img = document.createElement('img');
        img.id = 'avatarPreview';
        img.alt = 'Foto de Perfil';
        img.style.cssText = 'width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #16a34a;';
        const wrap = document.getElementById('avatarWrap');
        wrap.insertBefore(img, wrap.firstChild);
      }
      img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
<script>
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("show");
  var o = document.getElementById("sidebarOverlay"); if(o) o.classList.toggle("active");
}
</script>
</body>
</html>
