<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" th:href="@{/css/produtor.css}"/>

<title>Alterar Quantidade</title>
</head>

<body class="container py-5">

<h3 class="text-accent mb-4">
<i class="bi bi-stack"></i> Alterar Quantidade
</h3>

<div class="card card-custom p-4">

<div class="mb-3">
<label>Nova Quantidade</label>
<input type="number" id="novaQtd" class="form-control">
</div>

<button id="btnQtd" class="btn btn-accent w-100">
Guardar
</button>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$("#btnQtd").click(function(){
    let qtd = $("#novaQtd").val();

    $.post("/produtor/editar-quantidade", {
        quantidade: qtd
    }, function(){
        alert("Quantidade actualizada!");
    });
});
</script>

</body>
</html>
