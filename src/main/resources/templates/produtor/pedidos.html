<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedidos Recebidos – SGPA</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/css/produtor.css}"/>
</head>

<body class="dashboard-body">

<div class="container py-4">

  <h4 class="fw-semibold mb-4">
    <i class="bi bi-list-check text-success me-2"></i>
    Pedidos Recebidos
  </h4>

  <div class="table-responsive">
    <table class="table table-hover align-middle">

      <thead class="table-success">
      <tr>
        <th>#</th>
        <th>Comprador</th>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Data</th>
        <th>Estado</th>
        <th>Acções</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="pedido, iStat : ${pedidosRecebidos}">
        <td th:text="${iStat.count}"></td>
        <td th:text="${pedido.nomeComprador}"></td>
        <td th:text="${pedido.nomeProduto}"></td>
        <td th:text="${pedido.quantidade}"></td>
        <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}"></td>

        <!-- Estado -->
        <td>
          <span th:class="'badge ' +
              (${pedido.estado} == 'aceite' ? 'bg-success' :
              (${pedido.estado} == 'rejeitado' ? 'bg-danger' : 'bg-warning text-dark'))"
                th:text="${pedido.estado}">
          </span>
        </td>

        <!-- Acções -->
        <td class="d-flex gap-1">

          <button class="btn btn-sm btn-success"
                  th:data-id="${pedido.id}">
            <i class="bi bi-check-lg"></i>
          </button>

          <button class="btn btn-sm btn-danger"
                  th:data-id="${pedido.id}">
            <i class="bi bi-x-lg"></i>
          </button>

        </td>
      </tr>

      <!-- Vazio -->
      <tr th:if="${#lists.isEmpty(pedidosRecebidos)}">
        <td colspan="7" class="text-center text-muted py-4">
          <i class="bi bi-inbox fs-3 d-block mb-2"></i>
          Nenhum pedido recebido ainda.
        </td>
      </tr>

      </tbody>

    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/dashboard-produtor.js}"></script>

</body>
</html>
