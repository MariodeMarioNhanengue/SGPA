<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registar Produtor – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="form-body">

	<nav class="navbar navbar-dark" id="mainNav">
	  <div class="container">

	    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
	      
	      <i class="bi bi-arrow-left-circle me-1"></i>

	      <!-- LOGO -->
	      <img src="/images/logo.png" alt="Logo SGPA" class="logo-sm">

	      <!-- NOME -->
	      <span class="brand-text mb-0">SGPA</span>

	    </a>

	    <span class="text-light small opacity-75">
	      Registo de Produtor
	    </span>

	  </div>
	</nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <!-- Header -->
		<div class="form-header text-center mb-4">
		  
		  <div class="form-icon-wrap mb-3">
		    <img src="/images/logo.png" alt="Logo SGPA" class="logo-form">
		  </div>

		  <h2 class="form-page-title">
		    Criar conta de <span class="text-accent">Produtor</span>
		  </h2>

		  <p class="text-muted">
		    Preencha os dados abaixo para se registar como produtor agrário
		  </p>

		</div>

        <!-- Card Form -->
        <div class="form-card p-4 p-md-5">
        <form th:action="@{/produtor/cadastrar}" method="post">

            <!-- Dados Pessoais -->
            <div class="form-section-label mb-3">
              <i class="bi bi-person-lines-fill me-2"></i>Dados Pessoais
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="nome">Nome <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="nome" name="nome"
                         placeholder="Ex: João" maxlength="150" required/>
                  <div class="invalid-feedback">Nome é obrigatório.</div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="apelido">Apelido <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="apelido" name="apelido"
                         placeholder="Ex: Machava" maxlength="150" required/>
                  <div class="invalid-feedback">Apelido é obrigatório.</div>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="telefone">Telefone <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="tel" class="form-control phone-mask" id="telefone" name="telefone"
                         placeholder="84 000 0000" maxlength="20" required/>
                  <div class="invalid-feedback">Telefone é obrigatório.</div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email"
                         placeholder="exemplo@email.com" maxlength="100"/>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="nuit">NUIT</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                  <input type="text" class="form-control nuit-mask" id="nuit" name="nuit"
                         placeholder="000 000 000" maxlength="20"/>
                </div>
              </div>
              

            <!-- Localização -->
            <div class="form-section-label mt-4 mb-3">
              <i class="bi bi-geo-alt-fill me-2"></i>Localização
            </div>
			<div class="row g-3">
			              <!-- Província -->
			              <div class="col-md-4">
			                <label class="form-label" for="provinciaC">Província <span class="text-danger">*</span></label>
			                <div class="input-group">
			                  <span class="input-group-text"><i class="bi bi-map"></i></span>
			                  <select class="form-select" id="provinciaC" name="provincia" required>
			                    <option value="">Selecione...</option>
			                  </select>
			                  <div class="invalid-feedback">Selecione a província.</div>
			                </div>
			              </div>

			              <!-- Distrito (desabilitado até escolher província) -->
			              <div class="col-md-4">
			                <label class="form-label" for="distritoC">Distrito</label>
			                <div class="input-group">
			                  <span class="input-group-text"><i class="bi bi-pin-map"></i></span>
			                  <select class="form-select" id="distritoC" name="distrito" disabled>
			                    <option value="">Selecione a província...</option>
			                  </select>
			                </div>
			              </div>

			              <!-- Bairro (desabilitado até escolher distrito) -->
			              <div class="col-md-4">
			                <label class="form-label" for="bairroC">Bairro</label>
			                <div class="input-group">
			                  <span class="input-group-text"><i class="bi bi-house"></i></span>
			                  <select class="form-select" id="bairroC" name="bairro" disabled>
			                    <option value="">Selecione o distrito...</option>
			                  </select>
			                </div>
			              </div>
			            </div>

            <!-- Botão -->
            <div class="mt-4 d-grid">
       <button type="submit" class="btn btn-accent btn-lg">
  <i class="bi bi-check-circle-fill me-2"></i>
  Criar Conta de Produtor
</button>
            </div>

            <p class="text-center text-muted small mt-3">
              Já tem conta? <a href="#" class="text-accent">Entrar</a> &nbsp;·&nbsp;
              É comprador? <a href="/comprador/criar" class="text-accent">Registar como comprador</a>
            </p>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
  <script src="/js/geografica.js"> </script>
  <script src="/js/main.js"></script>
  <!-- <script src="/js/criar-produtor.js"></script> -->
</body>
</html>
