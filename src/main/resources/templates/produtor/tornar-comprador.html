<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tornar-se Comprador – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>

<body class="form-body">

  <nav class="navbar navbar-dark" id="mainNav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/produtor/dashboard}">
        <i class="bi bi-arrow-left-circle me-1"></i>
        <img src="/images/logo.png" alt="SGPA" class="logo-sm"/>
        <span class="brand-text">SGPA</span>
      </a>
      <span class="text-light small opacity-75">Tornar-se Comprador</span>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">

        <div class="text-center mb-4">
          <img src="/images/logo.png" class="logo-form mb-3" alt="logo"/>
          <h4 class="form-page-title">Tornar-se <span class="text-accent">Comprador</span></h4>
          <p class="text-muted small">Confirme as suas credenciais para activar o modo Comprador</p>
        </div>

        <!-- Alerta de erro -->
        <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span th:text="${erro}"></span>
        </div>

        <div class="page-card">
          <div class="page-card-header">
            <h5><i class="bi bi-cart-fill"></i>Confirmação de Identidade</h5>
          </div>
          <div class="p-4">

            <!-- Info box -->
            <div class="d-flex align-items-start gap-2 p-3 mb-4"
                 style="background:var(--green-pale);border-radius:var(--radius-sm);border:1px solid var(--border);">
              <i class="bi bi-info-circle-fill text-accent mt-1 flex-shrink-0"></i>
              <p class="mb-0 small" style="color:var(--text-body);">
                A sua conta de <strong>Produtor</strong> mantém-se activa. Poderá alternar entre os dois perfis a qualquer momento.
              </p>
            </div>

            <!-- Email identificado -->
            <div class="mb-4 text-center">
              <span class="prod-sub d-block mb-1">Conta identificada</span>
              <span class="badge rounded-pill px-3 py-2"
                    style="background:var(--green-pale);color:var(--green-dark);font-size:.9rem;border:1px solid var(--border);">
                <i class="bi bi-envelope-fill me-2"></i>
                <span th:text="${emailPre}">email@exemplo.com</span>
              </span>
            </div>

            <form th:action="@{/produtor/tornar-comprador}" method="post">
              <div class="mb-3">
                <label class="form-label fw-semibold">Email *</label>
                <input type="email" class="form-control" name="email"
                       th:value="${emailPre}" required placeholder="O seu email"/>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Senha *</label>
                <input type="password" class="form-control" name="senha"
                       required placeholder="A sua senha"/>
              </div>
              <button type="submit" class="btn btn-accent btn-lg w-100">
                <i class="bi bi-cart-fill me-2"></i>Confirmar e Entrar como Comprador
              </button>
            </form>

            <div class="text-center mt-3">
              <a th:href="@{/produtor/dashboard}" class="btn-voltar">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao Painel de Produtor
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
