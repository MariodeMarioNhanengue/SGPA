<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Histórico de Vendas – SGPA</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/css/produtor.css}"/>
</head>

<body class="dashboard-body">

<div class="container py-4">

  <h4 class="fw-semibold mb-4">
    <i class="bi bi-clock-history text-primary me-2"></i>
    Histórico de Vendas
  </h4>

  <div class="table-responsive">
    <table class="table table-hover align-middle">

      <thead class="table-primary">
      <tr>
        <th>#</th>
        <th>Produto</th>
        <th>Comprador</th>
        <th>Quantidade</th>
        <th>Valor Total</th>
        <th>Data</th>
        <th>Estado</th>
      </tr>
      </thead>

      <tbody>

      <tr th:each="venda, iStat : ${historicoVendas}">
        <td th:text="${iStat.count}"></td>
        <td th:text="${venda.nomeProduto}"></td>
        <td th:text="${venda.nomeComprador}"></td>
        <td th:text="${venda.quantidade} + ' ' + ${venda.unidade}"></td>
        <td th:text="'MT ' + ${#numbers.formatDecimal(venda.valorTotal, 1, 2)}"></td>
        <td th:text="${#temporals.format(venda.data, 'dd/MM/yyyy')}"></td>

        <td>
          <span class="badge bg-success">Concluída</span>
        </td>
      </tr>

      <!-- Vazio -->
      <tr th:if="${#lists.isEmpty(historicoVendas)}">
        <td colspan="7" class="text-center text-muted py-4">
          <i class="bi bi-graph-up fs-3 d-block mb-2"></i>
          Nenhuma venda registada ainda.
        </td>
      </tr>

      </tbody>

    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/dashboard-produtor.js}"></script>

</body>
</html>
