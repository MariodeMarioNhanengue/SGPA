<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" th:href="@{/css/produtor.css}"/>

<title>Publicar Oferta</title>
</head>

<body class="container py-5">

<h3 class="header-title text-accent mb-4">
<i class="bi bi-plus-circle-fill"></i> Publicar Oferta
</h3>

<div class="card card-custom p-4">

<form id="formOferta" th:action="@{/produtor/publicar-oferta}" method="post">

<input type="hidden"
       th:if="${_csrf != null}"
       th:name="${_csrf.parameterName}"
       th:value="${_csrf.token}"/>

<div class="mb-3">
<label>Produto</label>
<input type="text" name="produto" class="form-control" required>
</div>

<div class="mb-3">
<label>Quantidade</label>
<input type="number" name="quantidade" class="form-control" required>
</div>

<div class="mb-3">
<label>Preço (MZN)</label>
<input type="number" name="preco" class="form-control" required>
</div>

<button type="submit" class="btn btn-accent w-100">
<i class="bi bi-send-fill"></i> Publicar
</button>

</form>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$("#formOferta").submit(function(e){
    alert("Oferta enviada com sucesso!");
});
</script>

</body>
</html>
