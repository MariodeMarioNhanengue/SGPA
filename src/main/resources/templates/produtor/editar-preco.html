<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" th:href="@{/css/produtor.css}"/>

<title>Alterar Preço</title>
</head>

<body class="container py-5">

<h3 class="text-accent mb-4">
<i class="bi bi-currency-exchange"></i> Alterar Preço
</h3>

<div class="card card-custom p-4">

<input type="hidden" id="ofertaId" th:value="${ofertaId}"/>

<div class="mb-3">
<label>Novo Preço</label>
<input type="number" id="novoPreco" class="form-control">
</div>

<button id="btnPreco" class="btn btn-accent w-100">
Guardar
</button>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$("#btnPreco").click(function(){
    let preco = $("#novoPreco").val();

    $.post("/produtor/editar-preco", {
        preco: preco
    }, function(){
        alert("Preço actualizado com sucesso!");
    });
});
</script>

</body>
</html>
