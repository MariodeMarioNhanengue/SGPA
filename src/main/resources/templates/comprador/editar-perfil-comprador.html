<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Perfil – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/comprador.css"/>
</head>

<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<header class="mkt-header">
  <div class="mkt-header-top">
    <a class="mkt-logo" th:href="@{/comprador/dashboard(id=${comprador != null ? comprador.id : ''})}">
      <div class="mkt-logo-icon"><i class="bi bi-tree-fill"></i></div>
      <div>
        <span>SGPA</span>
        <small>Mercado Agrário</small>
      </div>
    </a>

    <div style="flex:1;"></div>

    <div class="mkt-user-area">
      <a th:href="@{/comprador/dashboard(id=${comprador != null ? comprador.id : ''})}"
         class="mkt-user-btn">
        <i class="bi bi-shop"></i>
        <span class="d-none d-sm-inline">Mercado</span>
      </a>
      <a th:href="@{/comprador/pedidos(id=${comprador != null ? comprador.id : ''})}"
         class="mkt-cart-btn">
        <i class="bi bi-bag-fill"></i>
        <span class="d-none d-sm-inline">Pedidos</span>
      </a>
      <a th:href="@{/logout}" class="mkt-user-btn" title="Sair">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </div>
  </div>

  <nav class="mkt-cats">
    <div class="mkt-cats-inner">
      <a th:href="@{/comprador/dashboard(id=${comprador != null ? comprador.id : ''})}" class="mkt-cat-link">
        <i class="bi bi-shop"></i> Mercado
      </a>
      <a th:href="@{/comprador/pedidos(id=${comprador != null ? comprador.id : ''})}" class="mkt-cat-link">
        <i class="bi bi-bag-heart-fill"></i> Os Meus Pedidos
      </a>
      <a class="mkt-cat-link active">
        <i class="bi bi-person-gear"></i> Editar Perfil
      </a>
    </div>
  </nav>
</header>

<!-- ═══════════════ CONTEÚDO ═══════════════ -->
<div style="max-width:780px;margin:2rem auto;padding:0 1.25rem 3rem;">

  <!-- Alertas -->
  <div th:if="${sucesso}" class="mkt-alert mkt-alert-success mb-3">
    <i class="bi bi-check-circle-fill"></i><span th:text="${sucesso}"></span>
  </div>
  <div th:if="${erro}" class="mkt-alert mkt-alert-danger mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${erro}"></span>
  </div>

  <div class="edit-card">
    <div class="edit-card-header">
      <i class="bi bi-person-fill"></i>
      <h5>Editar Perfil do Comprador</h5>
    </div>

    <div class="p-4">
      <form th:action="@{/comprador/editar-perfil(_method='put')}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${comprador.id}"/>

        <!-- FOTO DE PERFIL -->
        <div class="text-center mb-4">
          <div class="avatar-upload-wrap" id="avatarWrap">
            <img th:if="${comprador.fotoPerfil != null and !#strings.isEmpty(comprador.fotoPerfil)}"
                 th:src="${comprador.fotoPerfil}" id="avatarPreview" alt="Foto de Perfil"/>
            <div th:if="${comprador.fotoPerfil == null or #strings.isEmpty(comprador.fotoPerfil)}"
                 class="avatar-placeholder" id="avatarPlaceholder">
              <i class="bi bi-person-fill"></i>
            </div>
            <label for="fotoPerfilFile" class="avatar-upload-btn" title="Alterar foto">
              <i class="bi bi-camera-fill"></i>
            </label>
          </div>
          <input type="file" id="fotoPerfilFile" name="fotoPerfilFile"
                 accept="image/*" class="d-none" onchange="previewFoto(this)"/>
          <div class="text-muted small mt-1">Clique na câmara para alterar a foto</div>
        </div>

        <!-- DADOS PESSOAIS -->
        <div class="section-divider"><i class="bi bi-person-badge-fill"></i> Dados Pessoais</div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nome *</label>
            <input type="text" class="form-control" name="nome"
                   th:value="${comprador.nome}" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Apelido *</label>
            <input type="text" class="form-control" name="apelido"
                   th:value="${comprador.apelido}" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Telefone *</label>
            <input type="tel" class="form-control" name="telefone"
                   th:value="${comprador.telefone}" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email *</label>
            <input type="email" class="form-control" name="email"
                   th:value="${comprador.email}" required/>
          </div>
        </div>

        <!-- SENHA -->
        <div class="section-divider"><i class="bi bi-shield-lock-fill"></i> Segurança</div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Nova Senha
              <span class="text-muted fw-normal small">(deixe em branco para manter)</span>
            </label>
            <input type="password" class="form-control" name="senha" placeholder="Nova senha..."/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Confirmar Nova Senha</label>
            <input type="password" class="form-control" id="senhaConfirm"
                   placeholder="Confirme a nova senha..."/>
          </div>
        </div>

        <!-- LOCALIZAÇÃO -->
        <div class="section-divider"><i class="bi bi-geo-alt-fill"></i> Localização</div>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Província</label>
            <select class="form-select" id="provinciaC" name="provinciaNome">
              <option value="">Província...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Distrito</label>
            <select class="form-select" id="distritoC" name="distritoNome" disabled>
              <option value="">Distrito...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Bairro</label>
            <select class="form-select" id="bairroC" name="bairroNome" disabled>
              <option value="">Bairro...</option>
            </select>
          </div>
        </div>

        <!-- Valores actuais de localização para pré-selecção -->
        <input type="hidden" id="currentProvincia"
               th:value="${comprador.bairros != null and comprador.bairros.distrito != null and comprador.bairros.distrito.provincia != null ? comprador.bairros.distrito.provincia.nome : ''}"/>
        <input type="hidden" id="currentDistrito"
               th:value="${comprador.bairros != null and comprador.bairros.distrito != null ? comprador.bairros.distrito.nome : ''}"/>
        <input type="hidden" id="currentBairro"
               th:value="${comprador.bairros != null ? comprador.bairros.nome : ''}"/>

        <!-- BOTÕES -->
        <div class="d-flex gap-2 pt-2">
          <a th:href="@{/comprador/dashboard(id=${comprador.id})}" class="btn-cancelar">
            <i class="bi bi-arrow-left"></i> Cancelar
          </a>
          <button type="submit" class="btn-guardar">
            <i class="bi bi-check-circle-fill"></i> Guardar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script src="/js/geografica.js"></script>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
  const s1 = document.querySelector('input[name="senha"]').value;
  const s2 = document.getElementById('senhaConfirm').value;
  if (s1 && s1 !== s2) {
    e.preventDefault();
    alert('As senhas não coincidem!');
  }
});

function previewFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const placeholder = document.getElementById('avatarPlaceholder');
      if (placeholder) placeholder.remove();
      let img = document.getElementById('avatarPreview');
      if (!img) {
        img = document.createElement('img');
        img.id = 'avatarPreview';
        img.alt = 'Foto de Perfil';
        img.style.cssText = 'width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #e65100;';
        const wrap = document.getElementById('avatarWrap');
        wrap.insertBefore(img, wrap.firstChild);
      }
      img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// Pré-seleccionar localização — usa a função do geografica.js
// (geografica.js já chama inicializarGeo via DOMContentLoaded com os hidden inputs currentProvincia/Distrito/Bairro)
</script>
</body>
</html>
