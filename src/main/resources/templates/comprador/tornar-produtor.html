<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tornar-se Produtor – SGPA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 60%, #fff8e1 100%);
      display: flex; flex-direction: column;
      font-family: 'Nunito', sans-serif;
    }
    .confirm-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .confirm-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(46,125,50,.12);
      padding: 2.5rem 2rem;
      width: 100%; max-width: 440px;
    }
    .icon-ring {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #2e7d32, #66bb6a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem;
      font-size: 2rem; color: #fff;
      box-shadow: 0 4px 18px rgba(46,125,50,.3);
    }
    .confirm-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem; font-weight: 700;
      color: #1b5e20; text-align: center; margin-bottom: .3rem;
    }
    .confirm-sub {
      text-align: center; color: #777; font-size: .9rem; margin-bottom: 1.8rem;
    }
    .form-label { font-weight: 700; font-size: .85rem; color: #333; }
    .form-control {
      border-radius: 10px; border: 1.5px solid #c8e6c9;
      padding: .7rem 1rem; font-size: .95rem;
    }
    .form-control:focus {
      border-color: #4caf50;
      box-shadow: 0 0 0 3px rgba(76,175,80,.15);
    }
    .btn-confirmar {
      background: linear-gradient(135deg, #2e7d32, #4caf50);
      color: #fff; border: none; border-radius: 12px;
      padding: .75rem; font-size: 1rem; font-weight: 800;
      width: 100%; letter-spacing: .3px;
      box-shadow: 0 4px 14px rgba(46,125,50,.25);
      transition: opacity .2s;
    }
    .btn-confirmar:hover { opacity: .9; color: #fff; }
    .btn-voltar {
      display: block; text-align: center; margin-top: 1rem;
      color: #888; font-size: .85rem; text-decoration: none;
    }
    .btn-voltar:hover { color: #2e7d32; }
    .badge-info {
      background: #e8f5e9; color: #2e7d32; border-radius: 8px;
      padding: .6rem 1rem; font-size: .82rem; font-weight: 600;
      display: flex; align-items: center; gap: .5rem; margin-bottom: 1.5rem;
    }
    .email-chip {
      background: #f1f8e9; border: 1.5px solid #a5d6a7;
      border-radius: 8px; padding: .45rem .9rem;
      font-weight: 700; color: #2e7d32; font-size: .9rem;
      display: inline-flex; align-items: center; gap: .4rem;
    }
  </style>
</head>
<body>

  <div class="confirm-wrap">
    <div class="confirm-card">

      <div class="icon-ring"><i class="bi bi-shop"></i></div>
      <div class="confirm-title">Tornar-se Produtor</div>
      <div class="confirm-sub">Confirme as suas credenciais para activar o modo Produtor</div>

      <!-- Alerta de erro (flash) -->
      <div th:if="${erro}" class="alert alert-danger py-2 mb-3" style="border-radius:10px;font-size:.88rem;">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
      </div>

      <div class="badge-info">
        <i class="bi bi-info-circle-fill"></i>
        A sua conta de Comprador mantém-se activa. Poderá alternar entre os dois perfis a qualquer momento.
      </div>

      <div class="mb-3 text-center">
        <span class="text-muted small">Conta identificada:</span><br/>
        <span class="email-chip mt-1">
          <i class="bi bi-envelope-fill"></i>
          <span th:text="${emailPre}">email@exemplo.com</span>
        </span>
      </div>

      <form th:action="@{/api/v1/comprador/tornar-produtor}" method="post">
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" class="form-control" name="email"
                 th:value="${emailPre}" required placeholder="O seu email"/>
        </div>
        <div class="mb-4">
          <label class="form-label">Senha *</label>
          <input type="password" class="form-control" name="senha"
                 required placeholder="A sua senha"/>
        </div>
        <button type="submit" class="btn-confirmar">
          <i class="bi bi-shop me-2"></i>Confirmar e Entrar como Produtor
        </button>
      </form>

      <a th:href="@{/api/v1/comprador/dashboard}" class="btn-voltar">
        <i class="bi bi-arrow-left me-1"></i>Voltar ao Mercado
      </a>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
