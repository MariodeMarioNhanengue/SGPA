spring.application.name=Sistema_De_Venda_De_Produtos_Agricolas

server.port=8010

# Base de dados
spring.datasource.url=jdbc:mysql://localhost:3306/sgpa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Mariodemario

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Inicializar dados geográficos ao arrancar (se ainda não existirem)
spring.sql.init.mode=never

# Upload de imagens — valores únicos (sem duplicados)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2KB

# Recursos estáticos — APENAS o classpath; o WebMvcConfig trata do /uploads/**
spring.web.resources.static-locations=classpath:/static/
