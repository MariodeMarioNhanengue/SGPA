spring.application.name=Sistema_De_Venda_De_Produtos_Agricolas

server.port=8010

# Base de dados
spring.datasource.url=jdbc:mysql://localhost:3306/sgpa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Mariodemario

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Inicializar dados geográficos ao arrancar (se ainda não existirem)
spring.sql.init.mode=never

# Upload de imagens — valores únicos (sem duplicados)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2KB

# Recursos estáticos — APENAS o classpath; o WebMvcConfig trata do /uploads/**
spring.web.resources.static-locations=classpath:/static/
# EMAIL (SMTP) — usado para notificar comprador/produtor sobre pedidos
# ==============================================================
# Substitua pelos dados reais da sua conta de email de envio.
# Exemplo para Gmail: host=smtp.gmail.com, port=587, e use uma
# "palavra-passe de aplicação" (App Password) em spring.mail.password,
# não a palavra-passe normal da conta.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Enquanto estiveres a diagnosticar problemas de envio, deixa esta linha
# como "true" — imprime no terminal toda a conversação SMTP (útil para
# ver exatamente onde falha). Depois de funcionar, podes voltar a "false".
spring.mail.properties.mail.debug=true

# Liga/desliga o envio de emails de notificação sem remover a configuração acima.
# Útil enquanto o SMTP real ainda não está configurado (evita erros nos logs).
app.mail.enabled=true

# URL base da aplicação — usada para construir os links enviados por email
# (confirmação de conta, recuperação de senha). Ajusta para o domínio real em produção.
app.base-url=http://localhost:8080

# Termina a sessão automaticamente após 30 minutos de inactividade.
server.servlet.session.timeout=30m
