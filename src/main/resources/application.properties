spring.application.name=Sistema_De_Venda_De_Produtos_Agricolas
server.port=${PORT:8010}

# ──────────────────────────────────────────────────────────────────────────────
# Perfis
#   Por omissão usa-se o perfil "local" (application-local.properties, fora do Git).
#   Em produção defina SPRING_PROFILES_ACTIVE=prod e as variáveis de ambiente abaixo.
# ──────────────────────────────────────────────────────────────────────────────
spring.profiles.default=local

# ── Base de dados (valores sensíveis vêm do ambiente / perfil local) ──────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sgpa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Mantido em true porque as páginas Thymeleaf (MVC) dependem de lazy-loading nas vistas.
spring.jpa.open-in-view=true

# Dados geográficos são carregados pelo DataInitializer
spring.sql.init.mode=never

# ── Upload de imagens ─────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2KB

# Recursos estáticos — APENAS o classpath; o WebMvcConfig trata do /uploads/**
spring.web.resources.static-locations=classpath:/static/

# ── E-mail (SMTP) ─────────────────────────────────────────────────────────────
# Gmail: use uma "palavra-passe de aplicação", nunca a palavra-passe normal da conta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# true imprime toda a conversação SMTP no terminal (só para diagnóstico).
spring.mail.properties.mail.debug=false

# Liga/desliga o envio de e-mails de notificação
app.mail.enabled=${MAIL_ENABLED:true}

# URL base usada nos links enviados por e-mail (confirmação de conta, recuperação de senha).
# Em produção: o domínio real (ou o do front-end, se for uma app separada).
app.base-url=${APP_BASE_URL:http://localhost:8010}

# ── API REST ──────────────────────────────────────────────────────────────────
# JWT: segredo com no mínimo 32 caracteres. Sem segredo gera-se um aleatório no arranque
# (os tokens deixam de valer ao reiniciar).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# Origens permitidas (CORS) para o front-end web/móvel, separadas por vírgula
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Sessão do site MVC ────────────────────────────────────────────────────────
server.servlet.session.timeout=30m
